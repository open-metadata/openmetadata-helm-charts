name: Backport merged pull request

on:
  pull_request_target:
    types: [closed]
    branches: [main]

jobs:
  backport:
    if: >-
      github.event.pull_request.merged &&
      contains(toJSON(github.event.pull_request.labels.*.name), '"To Release ')
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: korthout/backport-action@v4
        with:
          label_pattern: '^To Release ([^ ]+)$'
