name: Lint and Test Open Metadata Helm Charts

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'NOTICE'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'NOTICE'

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # ct needs history to compare
          fetch-depth: 0
      
      - name: Determine comparison branch
        env:
          TARGET_BRANCH: ${{ github.base_ref || github.event.repository.default_branch }}
        run: |
          # Backports must be compared with their release branch, not main.
          echo "target_branch=$TARGET_BRANCH" >> "$GITHUB_ENV"

      - name: Install Helm
        uses: azure/setup-helm@v4
      
      - name: Add Helm repos
        run: |
          helm repo add opensearch https://opensearch-project.github.io/helm-charts/
          helm repo add mysql https://charts.bitnami.com/bitnami
          helm repo add airflow https://airflow.apache.org

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install chart-testing
        uses: helm/chart-testing-action@v2.8.0

      - name: Run chart-testing (list-changed)
        id: list-changed
        run: |
          changed=$(ct list-changed --target-branch="$target_branch")
          if [[ -n "$changed" ]]; then
            echo "::set-output name=changed::true"
          fi

      - name: Run chart-testing (lint)
        run: ct lint --target-branch="$target_branch" --check-version-increment=false
