{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mysql.name" . }}
  labels:
    {{- include "mysql.labels" . | nindent 4 }}
type: Opaque
data:
  mysql-root-password: {{ required "Set mysql.auth.rootPassword or mysql.auth.existingSecret" .Values.auth.rootPassword | b64enc | quote }}
  {{- if .Values.auth.username }}
  mysql-password: {{ required "Set mysql.auth.password when mysql.auth.username is set" .Values.auth.password | b64enc | quote }}
  {{- end }}
{{- end }}
