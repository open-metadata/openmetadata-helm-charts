apiVersion: v1
kind: Service
metadata:
  name: {{ include "mysql.name" . }}
  labels:
    {{- include "mysql.labels" . | nindent 4 }}
spec:
  type: {{ .Values.primary.service.type }}
  ports:
    - name: mysql
      port: {{ .Values.primary.service.port }}
      targetPort: mysql
      {{- if and (eq .Values.primary.service.type "NodePort") .Values.primary.service.nodePort }}
      nodePort: {{ .Values.primary.service.nodePort }}
      {{- end }}
  selector:
    {{- include "mysql.labels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mysql.name" . }}-headless
spec:
  clusterIP: None
  ports:
    - name: mysql
      port: {{ .Values.primary.service.port }}
      targetPort: mysql
  selector:
    {{- include "mysql.labels" . | nindent 4 }}
